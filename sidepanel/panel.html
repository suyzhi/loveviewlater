<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稍后再看</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div class="heading">
          <h1 class="title">稍后再看</h1>
          <p class="summary"><span id="count"></span><span id="backlogAge"></span></p>
        </div>
        <div class="header-actions">
          <button id="searchToggle" class="icon-btn" type="button" title="搜索" aria-label="搜索" aria-expanded="false" aria-controls="searchRow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          </button>
          <button id="randomBtn" class="icon-btn" type="button" title="命运三选一：从积压里抽三篇" aria-label="命运三选一">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/></svg>
          </button>
          <div class="menu-anchor">
            <button id="moreBtn" class="icon-btn" type="button" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            </button>
            <div id="moreMenu" class="menu" role="menu" aria-label="更多操作">
              <button id="exportBtn" class="menu-item" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
                <span class="menu-label">导出备份</span>
              </button>
              <button id="importBtn" class="menu-item" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>
                <span class="menu-label">从备份导入</span>
              </button>
              <div class="menu-sep" role="separator"></div>
              <button id="clearBtn" class="menu-item danger" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l.9 12.5h9.2l.9-12.5"/></svg>
                <span class="menu-label">清空全部</span>
              </button>
              <div class="menu-sep" role="separator"></div>
              <button id="reloadBtn" class="menu-item subtle" type="button" role="menuitem" title="修改代码后重新加载扩展">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
                <span class="menu-label">重新加载扩展</span>
                <span class="menu-tag">开发</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="searchRow" class="search-row hidden">
        <input id="searchInput" class="search-input" type="search" placeholder="搜索标题、网址或来源" aria-label="搜索标题、网址或来源">
      </div>

      <div id="currentCard" class="current-card">
        <span id="currentFavicon" class="favicon" aria-hidden="true"></span>
        <div class="current-text">
          <span id="currentLabel" class="current-label">当前页</span>
          <span id="currentTitle" class="current-title"></span>
        </div>
        <button id="addBtn" class="btn-primary" type="button" title="把当前页收进稍后再看">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span id="addLabel">收下</span>
        </button>
      </div>

      <div class="controls">
        <div id="filterTabs" class="filter-tabs" role="tablist" aria-label="筛选">
          <button class="filter-tab" type="button" role="tab" data-filter="all">全部<span class="tab-count"></span></button>
          <button class="filter-tab" type="button" role="tab" data-filter="unread">未读<span class="tab-count"></span></button>
          <button class="filter-tab" type="button" role="tab" data-filter="inProgress" title="读到一半">在读<span class="tab-count"></span></button>
          <button class="filter-tab" type="button" role="tab" data-filter="read">已读<span class="tab-count"></span></button>
          <button class="filter-tab" type="button" role="tab" data-filter="complete">读完<span class="tab-count"></span></button>
        </div>
        <select id="sortSelect" class="sort-select" title="排序" aria-label="排序">
          <option value="addedDesc">最新</option>
          <option value="addedAsc">最早</option>
          <option value="progressDesc">进度多</option>
          <option value="progressAsc">进度少</option>
          <option value="sourceAsc">按来源</option>
        </select>
      </div>
    </header>

    <section id="randomPicker" class="random-picker hidden" aria-label="命运三选一" aria-modal="true" role="dialog">
      <div class="random-picker-header">
        <div>
          <h2>命运三选一</h2>
          <p>越久没看，越容易被抽中</p>
        </div>
        <button id="randomCloseBtn" class="icon-btn" type="button" aria-label="关闭命运三选一">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="randomCards" class="random-cards"></div>
      <p id="randomError" class="random-error hidden" role="alert"></p>
      <div id="randomEmpty" class="random-empty hidden">
        <span class="empty-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <strong>暂时没有可抽的积压</strong>
        <span>已读、已读完或 7 天内抽过的内容不会出现</span>
      </div>
      <div class="random-picker-footer">
        <span id="randomPoolCount"></span>
        <button id="randomRerollBtn" class="btn-secondary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/></svg>
          换一批
        </button>
      </div>
    </section>

    <div id="emptyState" class="empty-state hidden">
      <span class="empty-mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 12h17"/><path d="M10 8h4M10 16h4"/></svg>
      </span>
      <p class="empty-text">抽屉还是空的</p>
      <p class="empty-hint"></p>
    </div>
    <ul id="list" class="list"></ul>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFileInput" accept=".json" class="hidden">
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
